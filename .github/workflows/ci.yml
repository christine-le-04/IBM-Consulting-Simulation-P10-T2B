name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Gradle wrapper executable
        working-directory: apps/api
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Verify Docker is available for PostgreSQL integration tests
        run: docker info
      - name: Test database report enforcement
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build & Test
        working-directory: apps/api
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: test-secret-key-at-least-64-bytes-long-for-hs512-algorithm-use-only-ci
          WATSONX_MOCK_MODE: true
          # Compatibility for the existing Testcontainers client with newer Docker daemons.
          JAVA_TOOL_OPTIONS: -Dapi.version=1.44
      - name: Require all PostgreSQL integration tests to execute
        if: always()
        run: python3 scripts/check_database_test_reports.py

  frontend:
    name: Frontend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Type-check
        working-directory: apps/web
        run: npm run type-check
      - name: Type-check tests
        working-directory: apps/web
        run: npm run type-check:tests
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm test

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t consulting-sim-api:${{ github.sha }} apps/api
      - name: Build Web image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://api.example.test
          -t consulting-sim-web:${{ github.sha }}
          apps/web
